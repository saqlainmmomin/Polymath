* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  overflow: hidden;
}
[hidden] { display: none !important; }

.app {
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
}
.hud {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  height: 36px;
  font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .08em;
  color: var(--ink2);
}
.hud .count b { color: var(--ink); font-weight: 600; }
.segs { display: flex; gap: 4px; flex: 1; max-width: 190px; }
.segs i { flex: 1; height: 4px; background: var(--soft); transition: background .2s; }
.segs i.done { background: var(--ink2); }
.segs i.now { background: var(--accent); }

.feed {
  position: relative; /* contains the visually hidden (absolute) labels so the page itself never gains scroll height */
  height: 100%;
  overflow-y: auto; overflow-x: hidden;
  scroll-snap-type: y mandatory;
  overscroll-behavior: contain;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }
.card {
  height: 100%;
  container-type: size;
  scroll-snap-align: start; scroll-snap-stop: always;
  overflow-y: auto; overflow-x: hidden;
  scrollbar-width: none;
}
.card::-webkit-scrollbar { display: none; }
/* Shared card layout: .hd (header cluster) at top, one flexible middle (the visual or the
   options, auto margins centre any leftover), .ft (text, controls, mental model) at the bottom.
   If a card ever outgrows the screen the card scrolls inside itself. */
.inner {
  height: 100%;
  display: flex; flex-direction: column; gap: var(--gap);
  padding-block: var(--space-2) var(--space-5);
}
.hd { display: flex; flex-direction: column; gap: var(--space-2); }
.ft { display: flex; flex-direction: column; gap: var(--space-3); }
.ft:not(:has(> :not([hidden]))) { display: none; }

.kicker {
  font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  color: var(--accent);
}
h1, h2 {
  margin: 0; font-family: var(--display); font-weight: 800; text-transform: uppercase;
  letter-spacing: .005em; line-height: .98;
}
h2 { font-size: clamp(30px, 9vw, 40px); }
h1 { font-size: clamp(30px, 9.4vw, 42px); }
h1 em { font-style: normal; color: var(--accent); }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.head .kicker { white-space: nowrap; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.lead { margin: 0; color: var(--ink2); font-size: 16px; }
.lead.sm { font-size: 14px; }

.stage {
  position: relative; flex: 1 1 0; min-height: var(--stage-min, 180px); max-height: var(--stage-max, 112cqw); margin-block: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  overflow: hidden;
}
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
.stage canvas.grab { cursor: grab; }
.stage canvas.grabbing { cursor: grabbing; }
.fig {
  position: absolute; right: 0; bottom: 0;
  padding: 3px 8px; background: var(--bg);
  border-top: 1px solid var(--line); border-left: 1px solid var(--line);
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--ink2);
  pointer-events: none;
}

.readout {
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--ink2);
}
.readout b { color: var(--ink); font-weight: 600; }

.strokebar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.strokebar .no { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--ink2); text-align: right; line-height: 1.5; white-space: nowrap; }
.strokebar .nm { font-family: var(--display); font-weight: 900; font-size: 44px; line-height: .9; text-transform: uppercase; }

.controls { display: flex; align-items: center; gap: 12px; }
.controls label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.btn {
  appearance: none; -webkit-appearance: none;
  min-height: 48px; padding: 0 18px;
  font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink); background: transparent;
  border: 1.5px solid var(--ink); border-radius: 2px;
  cursor: pointer; touch-action: manipulation;
}
.btn:hover { background: var(--soft); }
.btn:active { transform: translateY(1px); }
.btn.solid { background: var(--ink); color: var(--onink); }
.btn.solid:hover { background: var(--ink2); }
.btn.sm { min-width: 84px; }
:is(.btn, .opt, .chip, .seg, .vote, input[type=range], summary):focus-visible {
  outline: 3px solid var(--focus); outline-offset: 2px;
}

input[type=range] {
  -webkit-appearance: none; appearance: none;
  flex: 1; min-width: 0; height: 48px; margin: 0; background: transparent; touch-action: pan-y;
}
input[type=range]::-webkit-slider-runnable-track { height: 4px; background: var(--line); border-radius: 0; }
input[type=range]::-moz-range-track { height: 4px; background: var(--line); border-radius: 0; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 28px; height: 28px; margin-top: -12px;
  background: var(--accent); border: 3px solid var(--panel); border-radius: 50%; box-shadow: 0 0 0 1.5px var(--ink);
}
input[type=range]::-moz-range-thumb {
  width: 22px; height: 22px; background: var(--accent); border: 3px solid var(--panel); border-radius: 50%; box-shadow: 0 0 0 1.5px var(--ink);
}

.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.chip {
  appearance: none; -webkit-appearance: none;
  display: flex; flex-direction: row; align-items: center; gap: 6px;
  min-height: 44px; padding: 6px 8px;
  font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink); background: transparent; border: 1.5px solid var(--line); border-radius: 2px; cursor: pointer;
}
.chip .sw { width: 10px; height: 10px; flex: none; order: -1; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--onink); border-color: var(--ink); }
.desc { margin: 0; min-height: 4.1em; font-size: 15px; line-height: 1.38; }

.model { border-top: 1.5px solid var(--ink); padding-top: 8px; }
.model small { display: block; font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .16em; color: var(--ink2); margin-bottom: 2px; }
.model b { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.05; letter-spacing: .01em; }

.opts, .votes {
  --n: 4;
  flex: 1 1 auto; margin-block: auto;
  max-height: calc(var(--n) * 128px);
  display: grid; gap: var(--space-2); grid-auto-rows: minmax(min-content, 1fr);
}
.opts.locked { flex: 0 0 auto; max-height: none; grid-auto-rows: auto; }
.opt {
  appearance: none; -webkit-appearance: none;
  display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center;
  width: 100%; text-align: left; padding: clamp(var(--space-3), 1.8cqh, var(--space-4)) var(--space-3);
  font: inherit; font-size: 16px; font-weight: 500; color: var(--ink);
  background: var(--panel); border: 1.5px solid var(--line); border-radius: 2px; cursor: pointer;
  touch-action: manipulation;
}
.opt:hover { border-color: var(--ink); }
.opt-key { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--ink2); }
.opt-body { display: grid; gap: 4px; }
.opt-why { display: none; font-size: 14px; font-weight: 400; color: var(--ink2); }
.opt-tag { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .1em; white-space: nowrap; }
.opt.answered { cursor: default; }
.opt.answered .opt-why { display: block; }
.opt-why:empty { display: none !important; }
h2.q.sm { font-size: 22px; line-height: 1.05; }
.opt.ok { border-color: var(--good); background: var(--goodbg); }
.opt.ok .opt-tag { color: var(--good); }
.opt.bad { border-color: var(--bad); background: var(--badbg); }
.opt.bad .opt-tag { color: var(--bad); }

.explain { display: flex; flex-direction: column; gap: var(--space-3); }
.explain.grow { flex: 1 1 auto; justify-content: space-between; }
.explain p { margin: 0; font-size: 14.5px; line-height: 1.4; }
.explain input[type=range] { height: 40px; }
.bonus { padding: 8px 12px; border: 1px dashed var(--line); font-size: 14px; }
.bonus b { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; display: block; color: var(--accent); margin-bottom: 2px; }
.mini { position: relative; flex: 1 1 100px; min-height: 88px; max-height: 220px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
.mini canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.cue { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); text-align: center; padding-top: 2px; }
.cue::after { content: ''; display: block; width: 8px; height: 8px; margin: 6px auto 0; border-right: 2px solid var(--ink2); border-bottom: 2px solid var(--ink2); transform: rotate(45deg); }

details { font-size: 14px; color: var(--ink2); }
summary { cursor: pointer; font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); padding: 6px 0; min-height: 32px; }
details p { margin: 4px 0 0; }

.segrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg {
  appearance: none; -webkit-appearance: none;
  min-height: 48px; font-family: var(--display); font-weight: 800; font-size: 24px; text-transform: uppercase; letter-spacing: .02em;
  color: var(--ink); background: transparent; border: 1.5px solid var(--ink); border-radius: 2px; cursor: pointer;
}
.seg small { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; font-weight: 600; margin-left: 4px; }
.seg[aria-pressed="true"] { background: var(--ink); color: var(--onink); }

.qstep { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .1em; color: var(--ink2); }
.score { font-family: var(--display); font-weight: 900; font-size: 96px; line-height: .9; }
.fb { margin: 0; font-size: 15px; min-height: 2.9em; }
.fb b { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; }
.fb.ok b { color: var(--good); }
.fb.bad b { color: var(--bad); }

.votes { --n: 5; max-height: calc(var(--n) * 96px); }
.vote {
  appearance: none; -webkit-appearance: none;
  display: grid; gap: var(--space-1); align-content: center; text-align: left; width: 100%; padding: clamp(var(--space-2), 1.6cqh, var(--space-4)) var(--space-3);
  font: inherit; font-size: 16px; font-weight: 600; color: var(--ink);
  background: var(--panel); border: 1.5px solid var(--line); border-radius: 2px; cursor: pointer; touch-action: manipulation;
}
.vote:hover { border-color: var(--ink); }
.vote .soon { display: none; font-size: 13px; font-weight: 500; color: var(--accent); font-family: var(--mono); letter-spacing: .02em; }
.vote[aria-pressed="true"] { border-color: var(--accent); background: var(--bg); }
.vote[aria-pressed="true"] .soon { display: block; }

@media (max-height: 640px) {
  h2 { font-size: 30px; }
}
.recallbody { flex: 1 1 auto; display: flex; flex-direction: column; gap: var(--gap); }
.recallbody > .opts { --n: 3; }
.recallbody.done { justify-content: center; }
.ghost { visibility: hidden; }

.stage.quiet { --stage-min: 140px; --stage-max: 100cqw; border-color: var(--soft); }
.hows { display: grid; gap: var(--space-2); margin: 0; padding: 0; list-style: none; }
.hows li { display: flex; align-items: baseline; gap: var(--space-3); padding-top: var(--space-2); border-top: 1px dashed var(--line); font-size: 14px; color: var(--ink2); }
.hows b { flex: none; min-width: 92px; font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); }
.btn.start { width: 100%; min-height: 56px; font-size: 14px; }
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; }
}
</style>

      const q = c.questions[qi];
      const fb = h('p', { class: 'fb', 'aria-live': 'polite' });
      const next = h('button', { class: 'btn solid ghost', type: 'button', disabled: true, tabindex: '-1', 'aria-hidden': 'true', text: qi === c.questions.length - 1 ? 'See score' : 'Next question', onclick: () => { qi++; show(); } });
      let done = false;
      const opts = q.options.map((t, k) => h('button', {
        class: 'opt', type: 'button', onclick: () => {
          if (done) return; done = true;
          const right = k === q.a; if (right) score++;
          opts.forEach((b, j) => { b.setAttribute('aria-disabled', 'true'); b.classList.add('answered'); if (j === q.a) { b.classList.add('ok'); b.querySelector('.opt-tag').textContent = 'ANSWER'; } else if (j === k) { b.classList.add('bad'); b.querySelector('.opt-tag').textContent = 'NOT QUITE'; } });
          fb.className = 'fb ' + (right ? 'ok' : 'bad');
          fb.replaceChildren(h('b', { text: right ? 'RIGHT. ' : 'NOT QUITE. ' }), q.why);
          next.disabled = false; next.removeAttribute('tabindex'); next.removeAttribute('aria-hidden'); next.classList.remove('ghost');
        }
      }, h('span', { class: 'opt-key', text: 'ABC'[k] }), h('span', { class: 'opt-body' }, h('span', { class: 'opt-text', text: t })), h('span', { class: 'opt-tag' })));
      body.append(h('div', { class: 'qstep', text: 'QUESTION ' + (qi + 1) + ' OF ' + c.questions.length }),
        h('h2', { style: 'font-size:clamp(26px,7.4vw,32px)', text: q.q }),
        h('div', { class: 'opts', style: '--n:3' }, opts), fb, next);
    }
    show();
    return el;
  };

  R.branches = function (c) {
    const items = c.items.map(t => {
      const b = h('button', { class: 'vote', type: 'button', 'aria-pressed': 'false' }, h('span', { text: t }), h('span', { class: 'soon', text: c.soon }));
      b.addEventListener('click', () => b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true')));
      return b;
    });
    const { el } = baseCard(c, {
      head: [...head2(c, c.title), h('p', { class: 'lead sm', text: c.lead })],
      mid: [h('div', { class: 'votes' }, items)],
      foot: [h('button', { class: 'btn', type: 'button', text: c.restart, onclick: build })]
    });
    return el;
  };

  /* ---------- build / feed / progress ---------- */
  const feed = document.getElementById('feed');
  const countEl = document.getElementById('count');
  const segsEl = document.getElementById('segs');
  let io = null, cur = -1, nums = [];

  // The intro cover is not counted: cards after it are numbered 01..N and the cover shows "Intro".
  function countedTotal() { return EXPLAINER.cards.filter(c => c.type !== 'intro').length; }
  function setCurrent(i) {
    if (i === cur) return; cur = i;
    const num = nums[i] || 0;
    if (num) countEl.replaceChildren(h('b', { text: pad2(num) }), ' / ' + pad2(countedTotal()));
    else countEl.replaceChildren('Intro');
    [...segsEl.children].forEach((s, k) => { s.className = k < num - 1 ? 'done' : k === num - 1 ? 'now' : ''; });
  }
  function build() {
    if (io) io.disconnect();
    sims.length = 0; cur = -1; nums = [];
    feed.replaceChildren(); segsEl.replaceChildren();
    let counted = 0;
    const cards = EXPLAINER.cards.map((c, i) => {
      const el = R[c.type](c, i);
      el.dataset.i = i; el.dataset.type = c.type;
      if (c.type === 'intro') nums.push(0);
      else { nums.push(++counted); segsEl.append(h('i')); }
      return el;
    });
    feed.append(...cards);
    setCurrent(0);
    feed.scrollTo({ top: 0 });
    io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        const vis = en.intersectionRatio >= 0.5;
        if (vis) setCurrent(+en.target.dataset.i);
        (en.target.__sims || []).forEach(s => {
          const was = s.visible; s.visible = vis;
          if (vis && !was) { s.onShow && s.onShow(); s.draw(); }
        });
      });
    }, { root: feed, threshold: [0, 0.5, 0.75] });
    cards.forEach(c => io.observe(c));
    // draw static first frames
    requestAnimationFrame(() => sims.forEach(s => { s.visible = true; s.draw(); s.visible = false; }));
  }

  /* ---------- global wiring ---------- */
  readTheme();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTheme(); redrawAll(); });
  new MutationObserver(() => { readTheme(); redrawAll(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(redrawAll);
  document.addEventListener('keydown', e => {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;
    const k = e.key;
    if (k === 'ArrowDown' || k === 'PageDown') { feed.scrollBy({ top: feed.clientHeight, behavior: reducedMQ.matches ? 'auto' : 'smooth' }); e.preventDefault(); }
    else if (k === 'ArrowUp' || k === 'PageUp') { feed.scrollBy({ top: -feed.clientHeight, behavior: reducedMQ.matches ? 'auto' : 'smooth' }); e.preventDefault(); }
  });

  build();
  requestAnimationFrame(loop);
})();
</script>
