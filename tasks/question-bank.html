<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tell Me How: question bank</title>
<style>
:root{--bg:#faf7f2;--fg:#231f1a;--mute:#7a7066;--card:#fff;--line:#e8e1d6}
@media (prefers-color-scheme:dark){:root{--bg:#171513;--fg:#f1ebe2;--mute:#9b9185;--card:#211e1b;--line:#332f2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
h1{margin:0 0 8px;font-size:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1;min-width:180px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:16px}
button{font:inherit;font-size:14px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.on{background:var(--fg);color:var(--bg)}
.chips{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;padding:4px 10px;border-radius:99px;border:1.5px solid var(--c);background:transparent;color:var(--fg);cursor:pointer}
.chip.on{background:var(--c);color:#fff}
.chip small{opacity:.7;margin-left:3px}
main{max-width:760px;margin:0 auto;padding:8px 16px 80px}
h2{font-size:15px;margin:22px 0 8px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.05em}
h2 i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.q{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}
.q.picked{outline:2px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--card))}
.q b{display:block;font-size:17px;font-weight:600}
.q span{color:var(--mute);font-size:14px}
.q input{margin-top:4px;width:18px;height:18px;accent-color:var(--c);flex:none}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:none;gap:10px;align-items:center;justify-content:space-between}
#bar.show{display:flex}
.tag{display:inline-block;margin-left:8px;font-size:11px;letter-spacing:.06em;color:var(--c)}
.none{color:var(--mute);padding:30px 0;text-align:center}
</style></head><body>
<header><h1>Question bank <span style="color:var(--mute);font-weight:400;font-size:14px" id="count"></span></h1>
<div class="row"><input id="s" type="search" placeholder="Search questions and notes"><button id="shuf">Shuffle</button><button id="only">Picked only</button><button id="bk">From books</button></div>
<div class="chips" id="chips"></div></header>
<main id="list"></main>
<div id="bar"><span id="pc"></span><span><button id="copy">Copy picked</button> <button id="clear">Clear</button></span></div>

const ITEMS=[{"cat":"Space","q":"Why do astronauts float on the space station when gravity is still pulling them?","note":"They fall all the time and keep missing Earth.","color":"#6C5CE7","books":false},{"cat":"Space","q":"Why does a rocket spend most of its effort going sideways, not up?","note":"Orbit needs sideways speed, not height. Cannonball picture.","color":"#6C5CE7","books":false},{"cat":"Space","q":"Why is a day on Venus longer than its year?","note":"Spin slower than orbit. Two clocks, one planet.","color":"#6C5CE7","books":false},{"cat":"Space","q":"Why does the Moon always show us the same face?","note":"It does spin: once per orbit. Marked spot.","color":"#6C5CE7","books":false},{"cat":"Space","q":"Why do stars twinkle but planets mostly don't?","note":"Pinpoint light versus a tiny disc, through moving air.","color":"#6C5CE7","books":false},{"cat":"Space","q":"How do we measure how far away a star is?","note":"Thumb trick: the star shifts as Earth moves.","color":"#6C5CE7","books":false},{"cat":"Biology","q":"How does a seed know which way is up?","note":"Heavy grains inside cells sink and tell the root.","color":"#3FB37F","books":false},{"cat":"Biology","q":"Why doesn't a spider get stuck in its own web?","note":"Sticky threads and plain threads. It walks the plain ones.","color":"#3FB37F","books":false},{"cat":"Biology","q":"How does a tall tree lift water 100 metres with no pump?","note":"Evaporation pulls a chain of water up. Check.","color":"#3FB37F","books":false},{"cat":"Biology","q":"Where does the weight go when you lose fat?","note":"Mostly breathed out as a gas. Follow the atoms.","color":"#3FB37F","books":false},{"cat":"Biology","q":"Does a caterpillar really melt inside its cocoon?","note":"Mostly yes. Old body dissolves, tiny seeds rebuild it.","color":"#3FB37F","books":false},{"cat":"Biology","q":"How does a mosquito find you in the dark?","note":"Breath gas, warmth, smell. A trail to your skin.","color":"#3FB37F","books":false},{"cat":"Machines","q":"Does a microwave really cook food from the inside out?","note":"No. Waves reach only a short way in.","color":"#E8892B","books":false},{"cat":"Machines","q":"How does a zipper lock with one pull?","note":"A tiny wedge squeezes each tooth into the next.","color":"#E8892B","books":false},{"cat":"Machines","q":"How does a lock know which key is the right one?","note":"Pins lift to one line. Show a wrong key failing.","color":"#E8892B","books":false},{"cat":"Machines","q":"How does a toilet empty itself with one push?","note":"A hidden bent pipe starts a self-pulling flow (siphon).","color":"#E8892B","books":false},{"cat":"Machines","q":"Where does the heat from your food go when a fridge cools it?","note":"Out the back, into your kitchen. Heat moved, not cold made.","color":"#E8892B","books":false},{"cat":"Machines","q":"What stops a lift falling if its cable snaps?","note":"Spring brakes grip the rails when the speed is wrong.","color":"#E8892B","books":false},{"cat":"Nature","q":"Why do birds fly in a V?","note":"Each bird rides the lifting air of the one ahead.","color":"#6DBE45","books":false},{"cat":"Nature","q":"How does a Venus flytrap count to two?","note":"It shuts only after two touches close together.","color":"#6DBE45","books":false},{"cat":"Nature","q":"How do bees tell each other where the flowers are?","note":"A wiggle dance: angle is direction, length is distance.","color":"#6DBE45","books":false},{"cat":"Nature","q":"How do ants find the shortest path with no leader?","note":"Scent trails get stronger on the quick route.","color":"#6DBE45","books":false},{"cat":"Nature","q":"Why do leaves turn orange in autumn?","note":"The orange was always there, hidden by green.","color":"#6DBE45","books":false},{"cat":"Nature","q":"How do salmon find the river where they were born?","note":"They follow its smell across an ocean. Check.","color":"#6DBE45","books":false},{"cat":"Internet","q":"How does a message cross an ocean in a blink?","note":"Mostly along cables on the sea floor.","color":"#3F8FE0","books":false},{"cat":"Internet","q":"How does a website know you are the same person from one click to the next?","note":"A small ticket kept in your browser.","color":"#3F8FE0","books":false},{"cat":"Internet","q":"How does a whole film fit through your phone?","note":"It sends only what changes between pictures.","color":"#3F8FE0","books":false},{"cat":"Internet","q":"How does a search engine look through billions of pages in a blink?","note":"It reads a book index, not the pages.","color":"#3F8FE0","books":false},{"cat":"Internet","q":"Where are your photos when they are \"in the cloud\"?","note":"Buildings full of disks. Walk along a rack.","color":"#3F8FE0","books":false},{"cat":"Internet","q":"What happens in the second after you type a web address?","note":"A phone book lookup, then a hop across many computers.","color":"#3F8FE0","books":false},{"cat":"Money","q":"Where is your money when it sits in the bank?","note":"Mostly lent to other people. Follow one coin.","color":"#EDB10F","books":false},{"cat":"Money","q":"Who decides what a share of a company costs?","note":"Buyers and sellers line up, and the price is where they meet.","color":"#EDB10F","books":false},{"cat":"Money","q":"Why does a small pile of money grow slowly, then suddenly?","note":"Interest earns interest. Doubling squares on a board.","color":"#EDB10F","books":false},{"cat":"Money","q":"How does a vending machine know a coin is real?","note":"Weight, size and magnet tests, one gate each.","color":"#EDB10F","books":false},{"cat":"Money","q":"Where does money come from when a bank gives you a loan?","note":"Mostly typed into being. Ledger picture needs testing.","color":"#EDB10F","books":false},{"cat":"Money","q":"Why does a dollar buy less each year?","note":"Same basket, rising price tags. Basket shrinks.","color":"#EDB10F","books":false},{"cat":"Mind","q":"Why can't you tickle yourself?","note":"Your brain predicts your own touch and turns it down.","color":"#E0568B","books":false},{"cat":"Mind","q":"Why can't you see the hole in your eyesight?","note":"Your brain fills the gap. Dot test.","color":"#E0568B","books":false},{"cat":"Mind","q":"Why can a rubber hand start to feel like yours?","note":"Brush both together and your brain moves your hand.","color":"#E0568B","books":false},{"cat":"Mind","q":"How does a magician fool you right in front of your eyes?","note":"You miss what you do not watch. Hidden gorilla idea.","color":"#E0568B","books":false},{"cat":"Mind","q":"Why can you remember something wrongly and feel sure?","note":"Each memory is rebuilt, and can change. Telephone-game picture.","color":"#E0568B","books":false},{"cat":"Mind","q":"Why do you see faces in clouds and sockets?","note":"Your brain finds faces first. Spot them in random shapes.","color":"#E0568B","books":false},{"cat":"Physics","q":"Would a feather and a hammer really fall together on the Moon?","note":"Yes, with no air. Side-by-side drop.","color":"#2FB8C9","books":false},{"cat":"Physics","q":"Why does a spinning top stay up when it would fall if still?","note":"Spin resists tipping. Push it and watch it circle.","color":"#2FB8C9","books":false},{"cat":"Physics","q":"Why does a mirror seem to swap left and right but not up and down?","note":"It swaps front and back. Walk through it.","color":"#2FB8C9","books":false},{"cat":"Physics","q":"Why does a soap bubble show rainbow colours?","note":"A film thinner than light bounces waves apart.","color":"#2FB8C9","books":false},{"cat":"Physics","q":"Why does metal feel colder than wood in the same room?","note":"Same temperature. Metal pulls heat from you faster.","color":"#2FB8C9","books":false},{"cat":"Physics","q":"Why does a pendulum take about the same time for big and small swings?","note":"Longer path, faster speed. Two swings race.","color":"#2FB8C9","books":false},{"cat":"Chemistry","q":"How does salt make ice melt?","note":"It makes freezing harder, so ice turns back to water.","color":"#A2D13F","books":false},{"cat":"Chemistry","q":"How does a glow stick glow with no battery?","note":"Snapping a tube mixes two liquids that give off light.","color":"#A2D13F","books":false},{"cat":"Chemistry","q":"Why does a shaken fizzy drink explode?","note":"Gas hides in the liquid. Shaking makes bubble seeds.","color":"#A2D13F","books":false},{"cat":"Chemistry","q":"Is fire a solid, a liquid or a gas?","note":"A glowing gas, made by the reaction. Zoom in.","color":"#A2D13F","books":false},{"cat":"Chemistry","q":"How does a firework get its colours?","note":"Each metal burns its own colour. Match metal to colour.","color":"#A2D13F","books":false},{"cat":"Chemistry","q":"How does soap clean what water cannot?","note":"One end grabs water, one end grabs grease. Lifts it off.","color":"#A2D13F","books":false},{"cat":"Earth","q":"Is the ground under your feet moving?","note":"Yes, about as fast as fingernails grow. Rewind a map.","color":"#C8643B","books":false},{"cat":"Earth","q":"Why is the sea salty but a river is not?","note":"Rivers carry tiny amounts of salt. Sea water leaves it behind.","color":"#C8643B","books":false},{"cat":"Earth","q":"How do we know what is inside the Earth when nobody can dig that deep?","note":"Earthquake waves bend and stop. Read the echoes.","color":"#C8643B","books":false},{"cat":"Earth","q":"Why is it colder at the top of a mountain, closer to the Sun?","note":"Air cools as it spreads out. The sun heats the ground.","color":"#C8643B","books":false},{"cat":"Earth","q":"How does a cloud stay up when water is heavy?","note":"Droplets are tiny and rising air holds them.","color":"#C8643B","books":false},{"cat":"Earth","q":"Where do waves come from before they reach a calm beach?","note":"Storms thousands of miles away. Follow a wave back.","color":"#C8643B","books":false},{"cat":"History","q":"How did a Greek man measure the whole Earth with a stick?","note":"Two shadows, two towns, one angle.","color":"#B08A5A","books":false},{"cat":"History","q":"How did Roman water flow into cities with no pumps?","note":"A gentle downhill slope all the way, for many miles.","color":"#B08A5A","books":false},{"cat":"History","q":"How did the Romans build roads that still exist?","note":"Cross-section: layers of stone, gravel and sand.","color":"#B08A5A","books":false},{"cat":"History","q":"How did sailors know where they were before satellites?","note":"Star angle and a clock. Check.","color":"#B08A5A","books":false},{"cat":"History","q":"How did a printing press copy a page in minutes?","note":"Reusable metal letters, inked and pressed. Contrast with hand copying.","color":"#B08A5A","books":false},{"cat":"History","q":"How did people tell the time before clocks?","note":"A moving shadow. Check how they found noon.","color":"#B08A5A","books":false},{"cat":"Music","q":"Why do some notes sound good together and others clash?","note":"Their waves line up every few beats, or never.","color":"#D64545","books":false},{"cat":"Music","q":"Why does a violin sound different from a flute on the same note?","note":"Hidden extra notes mix in differently. Wave shapes.","color":"#D64545","books":false},{"cat":"Music","q":"How does a record turn a groove into music?","note":"The needle wiggles in the groove. Zoom in to bumps.","color":"#D64545","books":false},{"cat":"Music","q":"How do noise-cancelling headphones make noise disappear?","note":"They add the opposite wave. Two waves add to nothing.","color":"#D64545","books":false},{"cat":"Music","q":"Why does your voice sound different on a recording?","note":"You hear yourself through your bones too.","color":"#D64545","books":false},{"cat":"Music","q":"Why does a train horn drop in pitch as it passes?","note":"Waves bunch up in front and stretch behind.","color":"#D64545","books":false},{"cat":"Food","q":"Why does popcorn pop?","note":"Steam trapped in a hard shell bursts it. Slow motion.","color":"#F2762E","books":false},{"cat":"Food","q":"Why does an egg go solid when you cook it?","note":"Coiled proteins unfold and tangle. Watch the strands.","color":"#F2762E","books":false},{"cat":"Food","q":"Why does chilli feel hot when it is not?","note":"It tricks the sensor that warns of heat.","color":"#F2762E","books":false},{"cat":"Food","q":"Why does honey never go off?","note":"Too little water for germs. Show a germ drying out.","color":"#F2762E","books":false},{"cat":"Food","q":"Why do onions make you cry?","note":"Cutting makes a gas that stings your eyes.","color":"#F2762E","books":false},{"cat":"Food","q":"Why does toast taste so different from bread?","note":"Browning builds new flavour pieces. Zoom on the surface.","color":"#F2762E","books":false},{"cat":"Food","q":"Why does a pressure cooker cook faster?","note":"Water boils hotter when squeezed. Check.","color":"#F2762E","books":false},{"cat":"Medicine","q":"How can a harmless jab protect you from a disease?","note":"Your body practises on a fake. Practice fight.","color":"#4FC3B0","books":false},{"cat":"Medicine","q":"How does a painkiller know where it hurts?","note":"It does not. It travels everywhere.","color":"#4FC3B0","books":false},{"cat":"Medicine","q":"Why does a cut stop bleeding by itself?","note":"Tiny blood bits make a net. Watch it weave.","color":"#4FC3B0","books":false},{"cat":"Medicine","q":"Why do you get a fever when you are ill?","note":"Heat slows germs and speeds the defenders. Check.","color":"#4FC3B0","books":false},{"cat":"Medicine","q":"How does an X-ray see your bones through your skin?","note":"Bone blocks the rays more. Shadow picture.","color":"#4FC3B0","books":false},{"cat":"Medicine","q":"Why does a bruise change colour from purple to yellow?","note":"Spilled blood breaks down in stages.","color":"#4FC3B0","books":false},{"cat":"AI","q":"How does a computer tell a cat from a dog?","note":"Many simple filters, each spotting one clue.","color":"#8E6CF0","books":false},{"cat":"AI","q":"How does a chatbot choose its next word?","note":"It guesses the most likely word, one at a time.","color":"#8E6CF0","books":false},{"cat":"AI","q":"How does a computer learn from its mistakes?","note":"Nudge many knobs until the error shrinks. Knob picture.","color":"#8E6CF0","books":false},{"cat":"AI","q":"How does an AI draw a picture from words?","note":"It starts from noise and clears it away. Noise to picture.","color":"#8E6CF0","books":false},{"cat":"AI","q":"Why do chatbots sometimes make things up?","note":"They guess likely words, not look up facts.","color":"#8E6CF0","books":false},{"cat":"AI","q":"How does a self-driving car see the road?","note":"Lasers measure a 3D map many times a second.","color":"#8E6CF0","books":false},{"cat":"Security","q":"How can two strangers share a secret in front of everyone?","note":"Paint-mixing trick: easy to mix, hard to unmix.","color":"#4A5FC1","books":false},{"cat":"Security","q":"How can a website check your password without knowing it?","note":"It keeps a scrambled version that cannot be unscrambled.","color":"#4A5FC1","books":false},{"cat":"Security","q":"How long would a thief take to guess your password?","note":"Count the tries. Length beats cleverness.","color":"#4A5FC1","books":false},{"cat":"Security","q":"How does a hotel key card open only your room?","note":"A code on the card is checked and expires.","color":"#4A5FC1","books":false},{"cat":"Security","q":"How can you tell a real banknote from a perfect copy?","note":"Hidden features. Tilt it and watch them change.","color":"#4A5FC1","books":false},{"cat":"Security","q":"What does the little padlock in your browser do?","note":"Locks the line so others cannot read it.","color":"#4A5FC1","books":false},{"cat":"Flight","q":"How does a plane hold itself up?","note":"The wing throws air downward. Streamlines bending.","color":"#5DB4F0","books":false},{"cat":"Flight","q":"Why do planes leave white lines in the sky?","note":"Warm engine air freezes into cloud. Check.","color":"#5DB4F0","books":false},{"cat":"Flight","q":"Why do plane windows have a tiny hole?","note":"It protects the glass and lets pressure spread.","color":"#5DB4F0","books":false},{"cat":"Flight","q":"Why does a helicopter need a small propeller on its tail?","note":"Without it the body would spin the other way.","color":"#5DB4F0","books":false},{"cat":"Flight","q":"Why is the flight from New York to London faster than the way back?","note":"A river of fast air high up.","color":"#5DB4F0","books":false},{"cat":"Flight","q":"How can a plane land in thick fog?","note":"Radio beams draw an invisible slope to the runway.","color":"#5DB4F0","books":false},{"cat":"Energy","q":"Why don't birds get zapped on a power line?","note":"Both feet at the same voltage, so no path.","color":"#F5C518","books":false},{"cat":"Energy","q":"Why do power lines carry thousands of volts when your home uses far less?","note":"High voltage wastes less on the way. Transformer steps.","color":"#F5C518","books":false},{"cat":"Energy","q":"How does a solar panel make electricity with nothing moving?","note":"Light knocks electrons loose, and they flow.","color":"#F5C518","books":false},{"cat":"Energy","q":"When you flip a switch, how does the light come on at once?","note":"Electrons crawl, but the push travels fast.","color":"#F5C518","books":false},{"cat":"Energy","q":"What actually runs out when a battery goes flat?","note":"Its ingredients are used up. Show them depleting.","color":"#F5C518","books":false},{"cat":"Energy","q":"How can a lake be a battery?","note":"Pump water uphill when power is cheap, then let it fall.","color":"#F5C518","books":false},{"cat":"Cities","q":"How does a skyscraper stop swaying in the wind?","note":"A giant weight in the top swings the other way.","color":"#8A94A6","books":false},{"cat":"Cities","q":"How does a traffic light know a car is waiting?","note":"A wire loop under the road feels the metal.","color":"#8A94A6","books":false},{"cat":"Cities","q":"How does water reach the top floor of a tall building?","note":"Pumps, tanks, and the weight of the water.","color":"#8A94A6","books":false},{"cat":"Cities","q":"Why is a city hotter than the countryside around it?","note":"Dark roofs and roads soak up and keep heat.","color":"#8A94A6","books":false},{"cat":"Cities","q":"Where does the water go when you flush?","note":"Down pipes to a plant that cleans it.","color":"#8A94A6","books":false},{"cat":"Cities","q":"How do you dig a tunnel under a river?","note":"A giant drill with a ring wall built behind it.","color":"#8A94A6","books":false},{"cat":"Cities","q":"How does a big city get fed every day?","note":"Only a few days of food. Trucks flow in like blood.","color":"#8A94A6","books":false},{"cat":"Math","q":"How many people must be in a room for two to share a birthday?","note":"Just 23. Draw lines between every pair.","color":"#B45CE0","books":false},{"cat":"Math","q":"How many times must you fold a paper to reach the Moon?","note":"About 42 times if it could be done. Doubling.","color":"#B45CE0","books":false},{"cat":"Math","q":"What happens if you cut a twisted paper loop down the middle?","note":"One long loop, not two. Cut it live.","color":"#B45CE0","books":false},{"cat":"Math","q":"Why does switching doors double your chance in the three-door game?","note":"The host's reveal leaks information. Replay it 100 times.","color":"#B45CE0","books":false},{"cat":"Math","q":"Why do sunflower seeds spiral in two directions at once?","note":"Each new seed turns the same small angle. Seed packing.","color":"#B45CE0","books":false},{"cat":"Math","q":"Why is a billion so much bigger than a million?","note":"A million seconds is days, a billion is decades. Clock strip.","color":"#B45CE0","books":false},{"cat":"Art","q":"How do three colours of ink make every colour in a magazine?","note":"Zoom in: tiny dots your eye blends.","color":"#F0507A","books":false},{"cat":"Art","q":"Why do the eyes in a painting seem to follow you?","note":"A flat picture looks the same from every side.","color":"#F0507A","books":false},{"cat":"Art","q":"Why does mixing paints make brown but mixing lights make white?","note":"Paint takes colour away, light adds it. Two mixing rigs.","color":"#F0507A","books":false},{"cat":"Art","q":"How can a flat drawing look deep?","note":"Lines meet at one distant point. Draw a road.","color":"#F0507A","books":false},{"cat":"Art","q":"How do thirty still pictures a second become a movie?","note":"Your eye holds each one briefly. Flip-book picture.","color":"#F0507A","books":false},{"cat":"Art","q":"Why does the same grey look lighter on a dark background?","note":"Your eye compares. Two identical squares.","color":"#F0507A","books":false},{"cat":"Language","q":"Why do so many languages call mum \"mama\"?","note":"Babies' first easy sounds became the words. Map of languages.","color":"#3BA6A0","books":false},{"cat":"Language","q":"How did anyone read a language nobody could read?","note":"One stone with the same text in three scripts.","color":"#3BA6A0","books":false},{"cat":"Language","q":"Why does a foreign language sound like one long blur?","note":"Speech has no gaps between words. Waveform picture.","color":"#3BA6A0","books":false},{"cat":"Language","q":"Why do we write letters we never say, like the k in \"knight\"?","note":"We stopped saying them but kept the spelling. Timeline.","color":"#3BA6A0","books":false},{"cat":"Language","q":"Can a brand-new language appear in one generation?","note":"Children invented one with no teacher. Check.","color":"#3BA6A0","books":false},{"cat":"Language","q":"How can people talk across a valley by whistling?","note":"Whistles copy the speech tune. Wave on a map.","color":"#3BA6A0","books":false},{"cat":"Law","q":"How does a hair point to one person out of billions?","note":"Match several markers. Fits like a bar code.","color":"#7A6A55","books":false},{"cat":"Law","q":"Why do some countries drive on the left?","note":"Horse and sword habits. Check, and the story varies.","color":"#7A6A55","books":false},{"cat":"Law","q":"Who owns the air above your house?","note":"Layers: your land, planes' sky, space. Zoom upward.","color":"#7A6A55","books":false},{"cat":"Law","q":"How does a speed camera know how fast you went?","note":"Two lines in the road, or a radar echo.","color":"#7A6A55","books":false},{"cat":"Law","q":"Can a lie detector really tell when you are lying?","note":"It senses nerves, not lies. Graph of the same reaction.","color":"#7A6A55","books":false},{"cat":"Sport","q":"How can a footballer bend a free kick around a wall?","note":"Spin makes the air push the ball sideways.","color":"#E5503C","books":false},{"cat":"Sport","q":"Why can a cyclist ride faster behind another?","note":"A pocket of calm air, no head wind.","color":"#E5503C","books":false},{"cat":"Sport","q":"Why does a skater spin faster when pulling in their arms?","note":"Same spin, smaller circle. Arms in, spin up.","color":"#E5503C","books":false},{"cat":"Sport","q":"Why do golf balls have dimples?","note":"Dimples help air stick, so the ball goes further.","color":"#E5503C","books":false},{"cat":"Sport","q":"How can a high jumper clear a bar their body's middle goes under?","note":"Arched back lets the middle stay below the bar. Check.","color":"#E5503C","books":false},{"cat":"Sport","q":"How can a sailboat sail against the wind?","note":"The sail works like a wing. Zigzag path.","color":"#E5503C","books":false},{"cat":"Space","q":"Are the stars in a constellation really close together?","note":"Seen from the side, they are wildly far apart. [But Why]","color":"#6C5CE7","books":true},{"cat":"Space","q":"Why does a spacecraft glow red-hot when it comes back to Earth?","note":"Squeezed air heats up, not scraping. [How Everything Works]","color":"#6C5CE7","books":true},{"cat":"Space","q":"What would happen if you fell into a black hole?","note":"Stretched like spaghetti. Picture the pull. [TFK Big Book of Why]","color":"#6C5CE7","books":true},{"cat":"Space","q":"How big is the universe, really?","note":"Zoom out step by step. [Tell Me Why]","color":"#6C5CE7","books":true},{"cat":"Biology","q":"Where does a tree get its weight from?","note":"Mostly from air. Follow the gas into wood. [How Everything Works]","color":"#3FB37F","books":true},{"cat":"Biology","q":"How does a jellyfish sting with no brain?","note":"A tiny harpoon fires in a blink. [Brains On]","color":"#3FB37F","books":true},{"cat":"Biology","q":"Are birds really dinosaurs?","note":"Morph a bird skeleton into a dinosaur's. [Brains On]","color":"#3FB37F","books":true},{"cat":"Biology","q":"Why do animals' eyes glow in the dark?","note":"A mirror layer bounces light back. [TFK Big Book of Why]","color":"#3FB37F","books":true},{"cat":"Biology","q":"Do plants breathe?","note":"Tiny mouths on leaves open and close. [But Why]","color":"#3FB37F","books":true},{"cat":"Biology","q":"How does an oyster make a pearl?","note":"Layer on layer around a speck. [But Why]","color":"#3FB37F","books":true},{"cat":"Biology","q":"Why do your feet stink?","note":"Germs eat your sweat. [Brains On]","color":"#3FB37F","books":true},{"cat":"Machines","q":"Is a screw really just a ramp?","note":"Unwrap the thread and a slope appears. [Way Things Work]","color":"#E8892B","books":true},{"cat":"Machines","q":"How can one person lift a heavy load with a few ropes and wheels?","note":"Count the ropes. [Way Things Work]","color":"#E8892B","books":true},{"cat":"Machines","q":"How can a small push on a jack lift a car?","note":"Squeezed liquid trades distance for force. [Way Things Work]","color":"#E8892B","books":true},{"cat":"Machines","q":"How does a drone stay level in the wind?","note":"Four fans, quick sensors, constant fixing. [How Everything Works]","color":"#E8892B","books":true},{"cat":"Machines","q":"How does a scanner read a price from black and white stripes?","note":"Stripes are a number the laser reads. [Best Ever Why]","color":"#E8892B","books":true},{"cat":"Machines","q":"How does a  a giant magnet. [Way Things Work]","color":"#2FB8C9","books":true},{"cat":"Physics","q":"Can a speaker work as a microphone?","note":"Same coil and magnet, run in reverse. [Way Things Work]","color":"#2FB8C9","books":true},{"cat":"Physics","q":"How does a water gun shoot so far?","note":"Pumped air squeezes the water out. [Whoosh!]","color":"#2FB8C9","books":true},{"cat":"Chemistry","q":"Why is rust heavier than the iron it came from?","note":"Iron grabs air as it rusts. [Tell Me Why]","color":"#A2D13F","books":true},{"cat":"Chemistry","q":"Why can you blow a bubble with gum but not with a sweet?","note":"Stretchy chains hold the film. [Pop!]","color":"#A2D13F","books":true},{"cat":"Chemistry","q":"Where does a puddle go?","note":"Water slips into the air, unseen. [Best Ever Why]","color":"#A2D13F","books":true},{"cat":"Earth","q":"How does a bone turn into stone?","note":"Minerals slowly replace it, bit by bit. [But Why]","color":"#C8643B","books":true},{"cat":"Earth","q":"How does dripping water build stone icicles in a cave?","note":"Each drop leaves one speck behind. [How Everything Works]","color":"#C8643B","books":true},{"cat":"Earth","q":"Where does the rain that lands on you end up?","note":"Follow a drop down a river basin. [How Everything Works]","color":"#C8643B","books":true},{"cat":"Earth","q":"How deep is the deepest part of the ocean next to the tallest mountain?","note":"Stack Everest in the trench. [TFK Big Book of Why]","color":"#C8643B","books":true},{"cat":"History","q":"How can a stone arch stand with no glue?","note":"The top stone locks the rest in place. [Cathedral]","color":"#B08A5A","books":true},{"cat":"Music","q":"Why does music make you want to move?","note":"Your brain locks onto the beat. [But Why]","color":"#D64545","books":true},{"cat":"Food","q":"How does a bitter bean become chocolate?","note":"Ferment, roast, grind, melt. [Tell Me Why]","color":"#F2762E","books":true},{"cat":"Energy","q":"Why do wind turbines have three blades?","note":"Fewer blades spin freely, more block the air. [How Everything Works]","color":"#F5C518","books":true},{"cat":"Energy","q":"How can an electric car recharge itself when it brakes?","note":"The motor runs backwards as a generator. [How Everything Works]","color":"#F5C518","books":true},{"cat":"Energy","q":"How does a light bulb make light?","note":"Hot wire glows, then the newer kind skips heat. [But Why]","color":"#F5C518","books":true},{"cat":"Cities","q":"What is under a city street?","note":"Pipes, wires and tunnels in layers. [Street Beneath My Feet]","color":"#8A94A6","books":true},{"cat":"Art","q":"How does a camera catch a picture?","note":"Light through a small hole paints the scene. [Way Things Work]","color":"#F0507A","books":true}];
const cats=[...new Set(ITEMS.map(i=>i.cat))];
let active=new Set(),picked=new Set(),shuffled=false,onlyPicked=false,onlyBooks=false,term='';
try{picked=new Set(JSON.parse(localStorage.getItem('qb.picked')||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem('qb.picked',JSON.stringify([...picked]))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function chips(){$('chips').innerHTML=cats.map(c=>{const col=ITEMS.find(i=>i.cat===c).color;
 return '<button class="chip'+(active.has(c)?' on':'')+'" style="--c:'+col+'" data-c="'+c+'">'+c+'<small>'+ITEMS.filter(i=>i.cat===c).length+'</small></button>'}).join('')}
function card(i){const id=ITEMS.indexOf(i);
 return '<label class="q'+(picked.has(id)?' picked':'')+'" style="--c:'+i.color+'"><input type="checkbox" data-id="'+id+'"'+(picked.has(id)?' checked':'')+'><div><b>'+esc(i.q)+'</b><span>'+esc(i.note)+'</span>'+(i.books?'<span class="tag">FROM BOOKS</span>':'')+'</div></label>'}
function render(){
 let v=ITEMS.filter(i=>(!active.size||active.has(i.cat))&&(!term||(i.q+' '+i.note).toLowerCase().includes(term))&&(!onlyPicked||picked.has(ITEMS.indexOf(i)))&&(!onlyBooks||i.books));
 $('count').textContent=v.length+' of '+ITEMS.length;
 let h='';
 if(!v.length)h='<div class="none">Nothing here.</div>';
 else if(shuffled)h=v.slice().sort(()=>Math.random()-.5).map(card).join('');
 else for(const c of cats){const g=v.filter(i=>i.cat===c);if(g.length)h+='<h2 style="--c:'+g[0].color+'"><i></i>'+c+'</h2>'+g.map(card).join('')}
 $('list').innerHTML=h;chips();
 $('bar').classList.toggle('show',picked.size>0);$('pc').textContent=picked.size+' picked';
 $('shuf').classList.toggle('on',shuffled);$('only').classList.toggle('on',onlyPicked);$('bk').classList.toggle('on',onlyBooks)}
$('chips').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;const n=c.dataset.c;active.has(n)?active.delete(n):active.add(n);render()};
$('s').oninput=e=>{term=e.target.value.trim().toLowerCase();render()};
$('shuf').onclick=()=>{shuffled=!shuffled;render()};
$('bk').onclick=()=>{onlyBooks=!onlyBooks;render()};
$('only').onclick=()=>{onlyPicked=!onlyPicked;render()};
$('list').onchange=e=>{const id=+e.target.dataset.id;e.target.checked?picked.add(id):picked.delete(id);save();
 if(onlyPicked)render();else{e.target.closest('.q').classList.toggle('picked',e.target.checked);$('bar').classList.toggle('show',picked.size>0);$('pc').textContent=picked.size+' picked'}};
$('clear').onclick=()=>{picked.clear();save();render()};
$('copy').onclick=()=>{const t=[...picked].sort((a,b)=>a-b).map(i=>ITEMS[i].cat+': '+ITEMS[i].q).join('\n');
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{$('copy').textContent='Copied'},()=>{prompt('Copy:',t)});setTimeout(()=>$('copy').textContent='Copy picked',1500)};
render();
</script></body></html>
